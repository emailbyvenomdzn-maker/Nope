<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Nope Clock</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}.clock{text-align:center}.time{font-size:56px;font-weight:bold;letter-spacing:2px}.date{color:#aaa;margin-top:12px;font-size:16px}</style></head><body><div class="clock"><div id="time" class="time">00:00:00</div><div id="date" class="date"></div></div><script>function update(){const n=new Date();document.getElementById('time').textContent=n.toLocaleTimeString('pt-BR');document.getElementById('date').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});}update();setInterval(update,1000);</script></body></html>
